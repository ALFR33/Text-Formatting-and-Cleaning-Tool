                body { font-family: "Cairo", sans-serif; background: #fff; padding: 20px; text-align: center; }
                .text-card { max-width: 600px; margin: auto; padding: 25px; border-radius: 20px; border: 1px solid #eee; background: #fff; }

        <body>
            <div class="text-card">
                <h2>✍️ مُزخرف النصوص العربية الاحترافي</h2>
                
                <textarea id="txtInput" placeholder="اكتب نصك هنا..."></textarea>

                <div class="actions-grid">
                    <button class="btn-decorate" onclick="decorateAr()">✨ زخرفة عربية احترافية</button>
                    <button class="btn-clean" onclick="cleanSpaces()">إزالة الفراغات</button>
                    <button class="btn-clean" onclick="cleanLines()">حذف الأسطر</button>
                    <button class="btn-clean" onclick="addFrame()">إضافة إطار 〖 〗</button>
                    <button class="btn-clean" onclick="addStars()">إضافة نجوم ★</button>
                    <button class="btn-copy" onclick="copyResult()">نسخ النص المنسق 📋</button>
                </div>
            </div>

            <script>
                const area = document.getElementById("txtInput");

                // وظيفة الزخرفة العربية بدون تقطيع الحروف
                function decorateAr() {
                    let text = area.value;
                    if(!text) return;

                    // مصفوفة الزخارف (إضافة حركات تجميلية لا تقطع الحرف)
                    const decorations = ["۫", "۪", "۬", "ۭ", "ً", "ٌ", "ٍ", "َ", "ُ", "ِ", "ّ", "ْ"];
                    
                    let decoratedText = text.split(" ").map(word => {
                        // إضافة حركة عشوائية لبعض الحروف داخل الكلمة لتبدو مزخرفة
                        return word.split("").map(char => {
                            return (Math.random() > 0.7) ? char + decorations[Math.floor(Math.random() * decorations.length)] : char;
                        }).join("");
                    }).join(" ");

                    area.value = "꧁ " + decoratedText + " ꧂";
                }

                function addFrame() { area.value = "【 " + area.value + " 】"; }
                function addStars() { area.value = "★ " + area.value + " ★"; }
                function cleanSpaces() { area.value = area.value.replace(/\s+/g, " ").trim(); }
                function cleanLines() { area.value = area.value.split("\n").filter(l => l.trim() !== "").join("\n"); }
                
                function copyResult() {
                    area.select();
                    document.execCommand("copy");
                    alert("تم النسخ بنجاح! ✅");
                }
            </script>
